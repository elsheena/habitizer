<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Habitizer</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="sidebar-layout">
  <div id="navbar-container"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your Habitizer dashboard and streaks.</p>
      </div>

      <form id="login-form">
        <div class="form-group auth-form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input class="form-input" type="email" id="login-email" value="alex.doe@habitizer.io" required autocomplete="email">
        </div>

        <div class="form-group auth-form-group">
          <label class="form-label" for="login-password">Password</label>
          <input class="form-input" type="password" id="login-password" value="HabitSecure#2026" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary auth-submit-btn" id="btn-login-submit">
          Sign In to Habitizer
        </button>
      </form>

      <div class="auth-prompt-footer">
        Don't have an account? <a href="/register" class="auth-link-bold">Create Account</a>
      </div>

      <!-- Demo Preset Accounts -->
      <div class="demo-presets">
        <div class="demo-presets-title">Quick Demo Access</div>
        <button type="button" class="btn btn-secondary btn-sm btn-mock-preset" id="btn-preset-mock">
          Mock Account
        </button>
      </div>
    </div>
  </div>

  <script src="/js/icons.js"></script>
  <!-- Core Layer -->
  <script src="/js/core/StorageService.js"></script>
  <script src="/js/core/UserRepository.js"></script>
  <script src="/js/core/UserStateRepository.js"></script>
  <script src="/js/core/ThemeManager.js"></script>
  <!-- Services Layer -->
  <script src="/js/services/BackendSync.js"></script>
  <script src="/js/core/AuthService.js"></script>
  <script src="/js/services/HabitService.js"></script>
  <script src="/js/services/EconomyService.js"></script>
  <script src="/js/services/StreakService.js"></script>
  <script src="/js/services/CatalogService.js"></script>
  <script src="/js/services/CalendarService.js"></script>
  <script src="/js/services/CollisionEngine.js"></script>
  <!-- UI Components -->
  <script src="/js/components/UIComponent.js"></script>
  <script src="/js/components/ToastComponent.js"></script>
  <script src="/js/components/NavbarComponent.js"></script>
  <script src="/js/components/HabitCardComponent.js"></script>
  <script src="/js/components/StatsGridComponent.js"></script>
  <script src="/js/components/CatalogCardComponent.js"></script>
  <script src="/js/components/DayLogModalComponent.js"></script>
  <script src="/js/components/SlotCreationModalComponent.js"></script>
  <script src="/js/components/EventDetailModalComponent.js"></script>
  <script src="/js/components/RescheduleScopeModalComponent.js"></script>
  <script src="/js/components/CalendarGridComponent.js"></script>
  <script src="/js/components/PremiumModalComponent.js"></script>
  <!-- API Facade & Page Controller -->
  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
